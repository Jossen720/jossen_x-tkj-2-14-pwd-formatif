<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hubungi Saya</title>
    <style>
      body {
        background-color: #f8fafc;
        color: #1e293b;
        font-family: Arial, sans-serif;
        margin: 0;
      }

      #contact {
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .contact-form {
        background-color: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        max-width: 360px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      }

      .contact-form h2 {
        color: #0f172a;
        font-size: 18px;
        text-align: center;
        margin-top: 0;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        color: #334155;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 6px;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        box-sizing: border-box;
        background-color: #ffffff;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #2563eb;
        background-color: #eff6ff;
      }

      .btn-submit {
        background-color: #1e3a5f;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 4px;
      }

      .btn-submit:hover {
        background-color: #162c46;
      }

      .back-link {
        margin-top: 20px;
        text-align: center;
      }

      .back-link a {
        color: #4f46e5;
        font-size: 13px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form class="contact-form">
        <h2>Hubungi Saya</h2>
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>

      <div class="back-link">
        <a href="../index.html">Kembali ke Beranda</a>
      </div>
    </section>
  </body>
</html>
