<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Toko Online</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #334155;
      max-width: 280px;
      width: 100%;
      padding: 16px;
      box-sizing: border-box;
      text-align: left;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      margin-bottom: 16px;
    }

    .card h3 {
      color: #0f172a;
      font-size: 16px;
      margin: 0 0 8px 0;
    }

    .card p {
      color: #475569;
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 14px 0;
    }

    .card a {
      color: #d97706;
      font-size: 13px;
      text-decoration: underline;
    }

    footer {
      margin-top: 28px;
      text-align: center;
    }

    footer a {
      color: #4f46e5;
      font-size: 14px;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <div class="card">
      <img src="../assets/images/foto.jpg" alt="Website Toko Online">
      <h3>Website Toko Online</h3>
      <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
      <a href="#">Lihat Proyek</a>
    </div>
  </div>

  <footer>
    <a href="../index.html">Kembali ke Beranda</a>
  </footer>

</body>
</html>
