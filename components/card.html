<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Proyek</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #030303;
        color: #ffffff;
        font-family: Arial, sans-serif;
      }

      main {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 80px);
        padding: 20px;
      }

      .card {
        background-color: #1a1a1a;
        border: 2px solid #00f0ff;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        margin: 30px auto;
        padding: 20px;
        width: 320px;
      }

      .card img {
        display: block;
        height: 160px;
        object-fit: cover;
        width: 100%;
        border-radius: 6px;
      }

      .card h3 {
        color: #00f0ff;
        font-size: 1.25rem;
        margin-bottom: 8px;
        margin-top: 15px;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      }

      .card p,
      .card a {
        font-size: 15px;
      }

      .card p {
        color: #e2e8f0;
        line-height: 1.5;
        margin-bottom: 15px;
      }

      .card a {
        background-color: transparent;
        border: 2px solid #ff007f;
        border-radius: 6px;
        color: #ff007f;
        display: inline-block;
        font-weight: bold;
        padding: 10px 20px;
        text-decoration: none;
        text-align: center;
        width: 100%;
        box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        transition: all 0.3s ease;
      }

      .card a:hover {
        background-color: #ff007f;
        color: #000000;
        box-shadow: 0 0 20px #ff007f;
      }

      footer {
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #030303;
      }

      footer a {
        color: #00f0ff;
        text-decoration: none;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <main class="pembungkus-isi">
      <div class="card">
        <img src="../assets/images/foto.jpg" alt="Gambar Proyek" />
        <h3>Website Toko Online</h3>
        <p>
          Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan
          CSS.
        </p>
        <a href="#">Lihat Proyek</a>
      </div>
    </main>

    <footer>
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
