<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kumpulan Tombol</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #030303;
        font-family: Arial, sans-serif;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 40px;
      }

      h2 {
        color: #ffffff;
        font-size: 32px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        text-align: center;
      }

      .button-group {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 25px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        padding: 16px 32px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 18px;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        background-color: #030303;
        transition: all 0.3s ease;
      }

      .btn-primary {
        border: 2px solid #00f0ff;
        color: #00f0ff;
        box-shadow:
          0 0 15px rgba(0, 240, 255, 0.4),
          inset 0 0 10px rgba(0, 240, 255, 0.2);
      }

      .btn-primary:hover {
        background-color: #00f0ff;
        color: #000000;
        box-shadow: 0 0 25px #00f0ff;
      }

      .btn-secondary {
        border: 2px solid #ff007f;
        color: #ff007f;
        box-shadow:
          0 0 15px rgba(255, 0, 127, 0.4),
          inset 0 0 10px rgba(255, 0, 127, 0.2);
      }

      .btn-secondary:hover {
        background-color: #ff007f;
        color: #000000;
        box-shadow: 0 0 25px #ff007f;
      }

      .btn-outline {
        border: 2px solid #39ff14;
        color: #39ff14;
        box-shadow:
          0 0 15px rgba(57, 255, 20, 0.4),
          inset 0 0 10px rgba(57, 255, 20, 0.2);
      }

      .btn-outline:hover {
        background-color: #39ff14;
        color: #000000;
        box-shadow: 0 0 25px #39ff14;
      }

      .btn-send {
        border: 2px solid #ffb000;
        color: #ffb000;
        box-shadow:
          0 0 15px rgba(255, 176, 0, 0.4),
          inset 0 0 10px rgba(255, 176, 0, 0.2);
      }

      .btn-send:hover {
        background-color: #ffb000;
        color: #000000;
        box-shadow: 0 0 25px #ffb000;
      }

      footer {
        text-align: center;
        padding: 20px;
        background-color: #0a0a0a;
        border-top: 1px solid #111111;
      }

      footer a {
        color: #00f0ff;
        text-decoration: none;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Kumpulan Tombol Portofolio</h2>
      <div class="button-group">
        <a href="../pages/profile.html" class="btn btn-primary">Lihat Proyek</a>
        <a href="#" class="btn btn-secondary">Unduh CV</a>
        <a href="../pages/about.html" class="btn btn-outline">Hubungi Saya</a>
        <a href="../pages/contact.html" class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>

    <footer>
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
