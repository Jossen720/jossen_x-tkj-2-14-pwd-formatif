<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumpulan Tombol Portofolio</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      color: #0f172a;
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 28px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #fce7f3;
    }

    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    .btn-outline {
      background-color: #ffffff;
      border-color: #f59e0b;
    }

    .btn-secondary,
    .btn-outline {
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: rgba(2, 132, 199, 0.85);
    }

    .btn-secondary:hover {
      background-color: rgba(252, 231, 243, 0.7);
    }

    .btn-success:hover {
      background-color: rgba(22, 163, 74, 0.85);
    }

    .btn-outline:hover {
      background-color: rgba(254, 243, 199, 0.5);
    }
  </style>
</head>
<body>

  <h2>Kumpulan Tombol Portofolio</h2>
  <div class="button-group">
    <button class="btn btn-primary">Lihat Proyek</button>
    <button class="btn btn-secondary">Unduh CV</button>
    <button class="btn btn-success">Hubungi Saya</button>
    <button class="btn btn-outline">Kirim Pesan</button>
  </div>

</body>
</html>
